# The latest versions are available at https://fabricmc.net/develop
[versions]
minecraft = "26.1.2"
fabric-loader = "0.19.1"
fabric-api = "0.145.4+26.1.2"
fabric-language-kotlin = "1.13.10+kotlin.2.3.20"
fabric-loom = "1.16-SNAPSHOT"
sodium = "mc26.1.1-0.8.9-fabric"
modmenu = "18.0.0-alpha.8"

# You can access these by refreshing Gradle everytime you modify these, and then referencing them in build.gradle.kts as
# `libs.libraryname`, if it has a hyphen or underscore, then `libs.thing.thing`
# ex: `libs.minecraft` and `libs.fabric.api`
[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
sodium = { group = "maven.modrinth", name = "sodium", version.ref = "sodium" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]
dev-mods = [
    "sodium"
]
dependencies = [
    "modmenu"
]

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }