name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Type of build
        required: true
        options:
          - normal
          - snapshot
          - release
        default: normal

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup JDK (Java ${{ matrix.java }})
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: gradlew Permission Grant
        run: chmod +x gradlew

      - name: Build w/ Gradle
        run: ./gradlew --configuration-cache build

      - name: Publish Snapshot
        if: ${{ github.event.inputs.type == 'snapshot' }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsSnapshotsRepository
          -PdevOsSnapshotsUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsSnapshotsPassword="${{ secrets.MAVEN_PASS }}"

      - name: Publish Release
        if: ${{ github.event.inputs.type == 'release' }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsReleasesRepository
          -PdevOsReleasesUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsReleasesPassword="${{ secrets.MAVEN_PASS }}"

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/